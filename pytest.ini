[pytest]
testpaths = tests
# Without this, `import app` in tests/conftest.py only resolves when pytest
# is invoked as `python -m pytest` (which adds the cwd to sys.path as a
# side effect of `-m`) — a bare `pytest` invocation, exactly what CI's
# workflow runs, has no such path entry and fails with
# ModuleNotFoundError: No module named 'app' before a single test collects.
pythonpath = .
