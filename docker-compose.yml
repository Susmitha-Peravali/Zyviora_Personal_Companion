services:
  web:
    build: .
    ports:
      - "5000:5000"
    command: gunicorn --preload --workers 4 --bind 0.0.0.0:5000 app:app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://zyviora:${POSTGRES_PASSWORD:-zyviora}@postgres:5432/zyviora
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zyviora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zyviora}
      POSTGRES_DB: zyviora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyviora"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
