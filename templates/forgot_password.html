<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Forgot Password – Zyviora</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            /* .auth-bg-img below is deliberately scaled 5% larger than its
               box to hide blur edge artifacts, bleeding past the visible
               area by design — harmless as long as SOMETHING clips it.
               <html>, not <body>, is the actual page-level scrolling/clip
               box in most browsers, so overflow-x:hidden on body alone
               doesn't stop that bleed from becoming a real horizontal
               scrollbar on the page (the same lesson landing.css's
               position:fixed blobs already taught this codebase once). */
            overflow-x: hidden;
        }

        body {
            /* A hard height:100% + overflow:hidden here relied on 100vh's
               classic "toolbar hidden" sizing matching the real visible
               area on mobile — when the toolbar is actually showing, that
               assumption breaks and the bottom of the card can end up
               clipped below the fold with no way to scroll to it. */
            min-height: 100vh;
            min-height: 100svh;
            overflow-y: auto;
        }

        .auth-fullscreen {
            position: relative;
            width: 100%;
            /* Fixed (not min-) height on purpose: .auth-bg-img below needs
               a definite height to resolve its own height:100% against.
               Default overflow:visible + body's overflow-y:auto above
               together let content spill and scroll instead of clipping. */
            height: 100vh;
            height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            padding: 20px;
            box-sizing: border-box;
        }

        .auth-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.65;
            filter: blur(8px) brightness(1.2);
            z-index: 1;
            transform: scale(1.05);
        }

        .auth-bg-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(106, 0, 255, 0.1) 0%, rgba(10, 10, 20, 0.8) 100%);
            z-index: 2;
        }

        .auth-card-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        .premium-glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            padding: clamp(2rem, 8vw, 3.5rem) clamp(1.5rem, 6vw, 3rem);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            text-align: left;
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="auth-fullscreen">
        <img src="{{ url_for('static', filename='auth_side_image.png') }}" class="auth-bg-img" alt="Zyviora AI Visual">
        <div class="auth-bg-overlay"></div>

        <div class="auth-card-container">
            <div class="premium-glass-card">
                <div style="display:flex; justify-content:center; margin-bottom:10px;">
                    <img src="{{ url_for('static', filename='logo_light.png') }}" alt="Zyviora Logo"
                        style="width: 160px; height: auto; object-fit: contain; transform: scale(1.3);">
                </div>
                <h2 style="text-align: center; margin-bottom: 10px; font-weight: 700; color: #1a1a2e; font-size: 1.6rem;">
                    Forgot Password?</h2>
                <p style="text-align: center; margin-bottom: 25px; color: rgba(26, 26, 46, 0.7); font-size: 0.9rem;">
                    Enter the email on your account and we'll send you a link to reset your password.</p>

                <form id="forgotForm">
                    <label
                        style="font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; display: block; color: rgba(26, 26, 46, 0.8);">Email</label>
                    <input id="email" type="email" class="clay-input" placeholder="hello@zyviora.com" required
                        style="display:block; width: 100%; margin-bottom:24px; background: rgba(255,255,255,0.8);">

                    <button type="submit" class="clay-btn primary"
                        style="width:100%; font-size: 1.05rem; padding: 14px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px;">
                        Send Reset Link
                    </button>
                </form>

                <p id="status-msg"
                    style="margin-top:16px;font-size:0.9em;min-height:1em; text-align: center; font-weight: 500;"></p>

                <div style="margin-top: 20px; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 18px; text-align: center;">
                    <p style="font-size:0.9em;">
                        <a href="/login" style="color:var(--primary-color); text-decoration: none; font-weight: 600;">&larr; Back to Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const statusEl = document.getElementById('status-msg');
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Sending...';
            btn.disabled = true;

            try {
                const res = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
                    },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                statusEl.style.color = res.ok ? '#2ecc71' : '#d63031';
                statusEl.textContent = data.message || (res.ok ? 'Check your email for a reset link.' : 'Something went wrong.');
                if (res.ok) {
                    document.getElementById('forgotForm').reset();
                }
            } catch (err) {
                statusEl.style.color = '#d63031';
                statusEl.textContent = 'Network error. Please try again.';
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
    <script src="{{ url_for('static', filename='js/cursor.js') }}?v=4"></script>
</body>

</html>
