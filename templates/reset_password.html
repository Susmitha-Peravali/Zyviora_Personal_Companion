<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Reset Password – Zyviora</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        .auth-fullscreen {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            padding: 20px;
            box-sizing: border-box;
        }

        .auth-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.65;
            filter: blur(8px) brightness(1.2);
            z-index: 1;
            transform: scale(1.05);
        }

        .auth-bg-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(106, 0, 255, 0.1) 0%, rgba(10, 10, 20, 0.8) 100%);
            z-index: 2;
        }

        .auth-card-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        .premium-glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            padding: clamp(2rem, 8vw, 3.5rem) clamp(1.5rem, 6vw, 3rem);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            text-align: left;
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="auth-fullscreen">
        <img src="{{ url_for('static', filename='auth_side_image.png') }}" class="auth-bg-img" alt="Zyviora AI Visual">
        <div class="auth-bg-overlay"></div>

        <div class="auth-card-container">
            <div class="premium-glass-card">
                <div style="display:flex; justify-content:center; margin-bottom:10px;">
                    <img src="{{ url_for('static', filename='logo_light.png') }}" alt="Zyviora Logo"
                        style="width: 160px; height: auto; object-fit: contain; transform: scale(1.3);">
                </div>
                <h2 style="text-align: center; margin-bottom: 25px; font-weight: 700; color: #1a1a2e; font-size: 1.6rem;">
                    Set a New Password</h2>

                {% if not token %}
                <p style="text-align: center; color: #d63031; font-weight: 500;">
                    This reset link is missing its token. Please use the link from your email, or
                    <a href="/forgot-password" style="color:var(--primary-color);">request a new one</a>.
                </p>
                {% else %}
                <form id="resetForm">
                    <input type="hidden" id="token" value="{{ token }}">
                    <label
                        style="font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; display: block; color: rgba(26, 26, 46, 0.8);">New Password</label>
                    <input id="password" type="password" class="clay-input" placeholder="Choose a secure password"
                        required minlength="8" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
                        title="At least 8 characters, including a letter and a number"
                        style="display:block; width: 100%; margin-bottom:4px; background: rgba(255,255,255,0.8); padding: 12px 15px;">
                    <p style="font-size: 0.78rem; color: rgba(26, 26, 46, 0.55); margin: 0 0 24px 4px;">
                        At least 8 characters, with a letter and a number.</p>

                    <button type="submit" class="clay-btn primary"
                        style="width:100%; font-size: 1.05rem; padding: 14px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px;">
                        Reset Password
                    </button>
                </form>
                {% endif %}

                <p id="status-msg"
                    style="margin-top:16px;font-size:0.9em;min-height:1em; text-align: center; font-weight: 500;"></p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('resetForm');
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const token = document.getElementById('token').value;
                const password = document.getElementById('password').value;
                const statusEl = document.getElementById('status-msg');
                const btn = e.target.querySelector('button');
                const originalText = btn.innerHTML;
                btn.innerHTML = 'Resetting...';
                btn.disabled = true;

                try {
                    const res = await fetch('/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
                        },
                        body: JSON.stringify({ token, password })
                    });
                    const data = await res.json();
                    statusEl.style.color = res.ok ? '#2ecc71' : '#d63031';
                    statusEl.textContent = data.message || (res.ok ? 'Password reset!' : 'Something went wrong.');
                    if (res.ok) {
                        setTimeout(() => { window.location.href = '/login'; }, 1500);
                    } else {
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }
                } catch (err) {
                    statusEl.style.color = '#d63031';
                    statusEl.textContent = 'Network error. Please try again.';
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            });
        }
    </script>
    <script src="{{ url_for('static', filename='js/cursor.js') }}?v=4"></script>
</body>

</html>
